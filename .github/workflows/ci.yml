name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # No lockfile and no runtime dependencies, so the tests run on a bare checkout.
      - name: Unit tests
        run: npm test

      - name: Install dev dependencies
        run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint
