<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Meetly — בדיקת שרת</title>
  <style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f4fb;color:#202235;font:16px Arial,sans-serif}main{width:min(560px,calc(100% - 40px));box-sizing:border-box;padding:32px;background:#fff;border-radius:18px;box-shadow:0 16px 50px #36305b18}h1{margin-top:0}.status{padding:14px;border-radius:10px;background:#f3f1ff}.ok{background:#e7f8ee;color:#176b3d}.error{background:#ffebee;color:#a12424}code{direction:ltr;display:inline-block}</style>
</head>
<body>
  <main><h1>Meetly מחובר לשרת החדש</h1><p id="status" class="status">מתחבר ל-Supabase…</p><p>שרת: <code id="server"></code></p></main>
  <script src="./supabase-config.js"></script>
  <script>const c=window.MEETLY_SUPABASE,s=document.querySelector('#status');document.querySelector('#server').textContent=c.url;fetch(`${c.url}/auth/v1/settings`,{headers:{apikey:c.publishableKey}}).then(r=>{if(!r.ok)throw Error(`HTTP ${r.status}`);s.textContent='החיבור ל-Supabase הצליח ✓';s.classList.add('ok')}).catch(e=>{s.textContent=`לא הצלחנו להתחבר: ${e.message}`;s.classList.add('error')});</script>
</body>
</html>
